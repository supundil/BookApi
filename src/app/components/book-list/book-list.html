<div class="list-header">
  <h2>Books Collection</h2>
  <p>{{books.length}} titles found</p>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Book Details</th>
        <th>ISBN</th>
        <th>Publication</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td class="id-cell">#{{book.id}}</td>
        <td>
          <div class="book-title">{{book.title}}</div>
          <div class="book-author">{{book.author}}</div>
        </td>
        <td><code>{{book.isbn}}</code></td>
        <td>{{book.publicationDate | date:'yyyy-MM-dd'}}</td> 
        <td>
          <div class="action-buttons">
            <button class="btn-edit" (click)="editBook(book)">Edit</button>
            <button class="btn-delete" (click)="deleteBook(book.id)">Delete</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
